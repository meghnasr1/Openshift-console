apiVersion: v1
kind: ServiceAccount
metadata:
  name: readonly-console-sa
  namespace: console-system
  labels:
    app: readonly-console
---
# Create a secret for the service account token (K8s 1.24+)
apiVersion: v1
kind: Secret
metadata:
  name: readonly-console-sa-token
  namespace: console-system
  annotations:
    kubernetes.io/service-account.name: readonly-console-sa
type: kubernetes.io/service-account-token
